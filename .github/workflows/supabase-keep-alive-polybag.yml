name: Supabase Keep Alive (Polybag)

on:
  schedule:
    # Runs at 00:30 UTC every 3 days
    # (Supabase free tier pauses projects after 1 week of inactivity)
    - cron: '30 0 */3 * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Polybag Supabase Database
        run: |
          curl -i -X GET "${{ secrets.POLYBAG_SUPABASE_URL }}/rest/v1/companies?select=id&limit=1" \
          -H "apikey: ${{ secrets.POLYBAG_SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.POLYBAG_SUPABASE_KEY }}"
